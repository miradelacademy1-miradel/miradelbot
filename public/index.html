<!doctype html><html lang=uz><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#2F7F6F"><link rel=manifest href=/manifest.json><link rel=icon href=/icon.svg><link rel=preconnect href=https://fonts.googleapis.com><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel=stylesheet><link rel=stylesheet href=/theme.css><title>Miradel Academy</title></head><body>
<div class="card c-teal" style="margin-top:12vh;padding:28px"><div class=muted style="color:#fff9">Miradel Academy</div><h1>Xush kelibsiz</h1>
<input id=ph type=tel placeholder="Telefon raqam (+998...)" autocomplete=username>
<input id=pw type=password placeholder="Parol" autocomplete=current-password>
<button class=btn id=go>Kirish</button></div>
<script src=/common.js></script><script>
api('me').then(d=>location.href=d.role==='admin'?'/admin.html':'/student.html').catch(()=>{});
$('#go').onclick=async()=>{try{const d=await api('login','POST',{phone:$('#ph').value,password:$('#pw').value});location.href=d.role==='admin'?'/admin.html':'/student.html'}catch(x){toast(x.message)}};
$('#pw').onkeydown=ev=>{if(ev.key==='Enter')$('#go').click()};
</script></body></html>
